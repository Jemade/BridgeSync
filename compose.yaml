x-app: &app
  build: .
  image: bridgesync:local
  environment: &env
    DATABASE_URL: postgresql+psycopg://bridge:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/bridgesync
    REDIS_URL: redis://redis:6379/0
    CONNECTOR_URL: http://connector:8001/orders
    CONNECTOR_TOKEN: ${CONNECTOR_TOKEN:?Set CONNECTOR_TOKEN in .env}
    SECURE_COOKIE: ${SECURE_COOKIE:-false}
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bridgesync
      POSTGRES_USER: bridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U bridge -d bridgesync"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    <<: *app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  connector:
    <<: *app
    environment:
      <<: *env
      MOCK_DATABASE: /data/connector.db
    command: uvicorn app.mock_connector:app --host 0.0.0.0 --port 8001
    volumes: [connector-data:/data]
  worker:
    <<: *app
    command: celery -A app.worker.celery worker --loglevel=INFO --concurrency=2
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_healthy}
      connector: {condition: service_started}
  scheduler:
    <<: *app
    command: celery -A app.worker.celery beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  postgres-data:
  redis-data:
  connector-data:
